name: app_base
description: "Reusable Flutter base template."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Network
  dio: ^5.7.0
  url_launcher: ^6.2.5

  # Storage
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.2.2

  # Localization
  easy_localization: ^3.0.7

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  pretty_dio_logger: ^1.4.0

  # DI
  get_it: ^8.0.0
  flutter_launcher_icons: ^0.14.4

  # UI
  flutter_svg: ^2.0.10+1

  # Loading Widget
  loading_animation_widget: ^1.3.0

  flutter_screenutil: ^5.9.3
  photo_view: ^0.15.0
  intl: ^0.20.0
  gif: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
    - assets/images/flags/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
