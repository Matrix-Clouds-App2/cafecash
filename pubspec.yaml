name: coffee_shop
description: "Coffee Shop Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Network
  dio: ^5.7.0
  url_launcher: ^6.2.5

  # Storage
  get_storage: ^2.1.1

  # Localization
  easy_localization: ^3.0.7

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  collection: ^1.18.0
  pretty_dio_logger: ^1.4.0

  # DI
  get_it: ^8.0.0
  flutter_launcher_icons: ^0.14.4

  # UI
  flutter_svg: ^2.0.10+1
  flutter_html: ^3.0.0
  flutter_markdown: ^0.7.7+1
  font_awesome_flutter: ^11.0.0

  # Loading Widget
  loading_animation_widget: ^1.3.0

  flutter_screenutil: ^5.9.3
  photo_view: ^0.15.0
  geolocator: ^14.0.2

  # Sensors (accelerometer + magnetometer for indoor PDR tracking)
  sensors_plus: ^4.0.0

  # Prayer Timings & Qiblah
  hijri: ^3.0.0
  intl: ^0.20.0
  flutter_qiblah: ^3.2.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^5.0.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  #  flutter_app_badger: ^1.5.0
  gif: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
    - assets/images/flags/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
